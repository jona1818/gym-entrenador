<!DOCTYPE html><html lang="es"><head>
<title>Bitácora del Entrenador</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#E8611A"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface2:#E9E6DF; --line:#D6D2C8;
  --ink:#171A21; --ink2:#5B5F6B; --ink3:#8A8E99;
  --accent:#E8611A; --accent-ink:#FFFFFF; --accent-soft:#FCE3D4;
  --ok:#2E8B57; --shadow:0 2px 10px rgba(20,20,30,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1218; --surface:#181C25; --surface2:#222835; --line:#2E3543;
    --ink:#F2F0EA; --ink2:#A9AEBA; --ink3:#6E7482;
    --accent:#FF7A2F; --accent-ink:#14100C; --accent-soft:#3A2416;
    --ok:#4FC27A; --shadow:0 2px 12px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1218; --surface:#181C25; --surface2:#222835; --line:#2E3543;
  --ink:#F2F0EA; --ink2:#A9AEBA; --ink3:#6E7482;
  --accent:#FF7A2F; --accent-ink:#14100C; --accent-soft:#3A2416;
  --ok:#4FC27A; --shadow:0 2px 12px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;font-size:28px;margin:0;letter-spacing:.01em;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .sub{font-size:13px;color:var(--ink2);display:block;font-family:Barlow;text-transform:none;font-weight:500;letter-spacing:0}
main{flex:1;padding:16px;padding-bottom:96px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:var(--surface2);color:var(--ink);padding:12px 16px;font-weight:600;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--ink2);padding:8px 10px;min-height:36px}
button.icon{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:22px;line-height:1;border-radius:12px}
button.danger{background:transparent;color:#C8402A;border:1px solid var(--line)}
button.big{font-family:"Barlow Condensed";font-size:22px;text-transform:uppercase;letter-spacing:.04em;padding:16px;border-radius:14px;width:100%}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;gap:14px;align-items:center;text-align:left;padding:0;width:100%;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);min-height:84px}
.item .av{width:72px;align-self:stretch;flex:none;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed";font-size:30px;font-weight:700;color:var(--accent);overflow:hidden}
.item .av img{width:100%;height:100%;object-fit:cover}
.item .body{flex:1;padding:12px 12px 12px 0;min-width:0}
.item .name{font-family:"Barlow Condensed";font-size:23px;font-weight:700;text-transform:uppercase;line-height:1.05}
.item .meta{color:var(--ink2);font-size:14px;margin-top:3px}
.item .go{padding-right:14px;color:var(--ink3);font-size:22px}
.ex{display:flex;gap:12px;padding:12px;align-items:center;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .thumb{width:60px;height:60px;border-radius:10px;background:var(--surface2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:24px;overflow:hidden}
.ex .thumb img{width:100%;height:100%;object-fit:cover}
.ex .info{flex:1;min-width:0}
.ex .title{font-weight:600;font-size:17px}
.ex .tgt{color:var(--ink2);font-size:14px}
.handle{color:var(--ink3);display:flex;flex-direction:column;gap:2px}
.handle button{min-height:0;padding:4px 8px;background:transparent}
.field{display:flex;flex-direction:column;gap:6px}
label.lbl{font-size:13px;font-weight:600;color:var(--ink2)}
input,select,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:46px}
textarea{min-height:80px;resize:vertical}
input[type=number]{font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;text-align:center;font-family:"Barlow Condensed"}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}
.media{width:100%;aspect-ratio:3/2;background:var(--surface2);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.media img,.media iframe,.media video{width:100%;height:100%;object-fit:cover;border:0;display:block}
.wex{padding:14px}
.wex h2{font-family:"Barlow Condensed";font-size:26px;text-transform:uppercase;margin:0 0 2px;font-weight:700;line-height:1.05}
.wex .last{color:var(--ink2);font-size:14px;margin-bottom:10px}
.wex .last b{color:var(--ink)}
.sets{display:grid;grid-template-columns:38px 1fr 1fr 44px;gap:8px;align-items:center}
.sets .h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:center;font-weight:600}
.sets .n{font-family:"Barlow Condensed";font-size:20px;font-weight:700;color:var(--ink3);text-align:center;font-variant-numeric:tabular-nums}
.sets .done{background:var(--ok);color:#fff}
.sets input[type=number]{padding:8px}
.sets input.filled{border-color:var(--ok)}
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center}
.nav .in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;background:transparent;border-radius:0;padding:10px 0 12px;color:var(--ink3);font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:22px}
.nav button.on{color:var(--accent)}
.stickybar{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px 14px;display:flex;justify-content:center}
.stickybar .in{display:flex;gap:10px;width:100%;max-width:560px}
.stickybar .in > *{flex:1}
.hist{padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);width:100%;background:transparent;border-radius:0;text-align:left;font-weight:500}
.hist:last-child{border-bottom:0}
.hist .d{font-family:"Barlow Condensed";font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);min-width:64px}
.hist .r{flex:1;min-width:0}
.hist .r small{display:block;color:var(--ink2)}
.hist .vol{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.empty{text-align:center;color:var(--ink2);padding:32px 20px}
.empty .big-ico{font-size:44px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:600;color:var(--ink2);min-height:0}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.status{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.detail-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;gap:10px}
.detail-row:last-child{border-bottom:0}
.pr{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}
.timerbar{position:sticky;top:64px;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.timerbar .t{font-family:"Barlow Condensed";font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;min-width:96px}
.timerbar .lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.timerbar .lab b{display:block;color:var(--ink2);font-size:13px;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.timerbar.resting{border-color:var(--accent);background:var(--accent-soft)}
.timerbar.resting .t{color:var(--accent)}
.timerbar.done{border-color:var(--ok)}
.timerbar.done .t{color:var(--ok)}
.timerbar .acts{margin-left:auto;display:flex;gap:6px}
.timerbar .acts button{min-height:36px;padding:6px 10px;font-size:14px}
.ring{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:6px}
.ring i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.fb{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.fb:last-child{border-bottom:0}
.fb .ico{font-size:22px;flex:none;width:30px;text-align:center}
.fb .tx{flex:1;min-width:0}
.fb .tx b{display:block}
.fb .tx small{color:var(--ink2)}
.banner{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.banner .big{font-family:"Barlow Condensed";font-size:30px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.banner .tx{flex:1;font-size:14px;color:var(--ink2)}
.banner .tx b{color:var(--ink);display:block;font-size:15px}
.dots{display:flex;gap:5px;margin-top:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface2);display:inline-block}
.dots i.on{background:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);max-height:80vh;overflow:auto}
.modal h3{margin:0;font-family:"Barlow Condensed";font-size:24px;text-transform:uppercase;font-weight:700}
.modal p{margin:0;color:var(--ink2)}
.modal .row button{min-height:48px}
.modal .opt{text-align:left;display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:12px 14px}
.modal .opt small{color:var(--ink2);font-weight:500}
@media (min-width:600px){.modal-bg{align-items:center}}
.sec{display:flex;justify-content:space-between;align-items:center}
.sec .eyebrow{margin:0}

.bk{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);width:100%;background:transparent;border-radius:0;text-align:left;font-weight:500}
.bk:last-child{border-bottom:0}
.bk .th{width:46px;height:46px;border-radius:9px;background:var(--surface2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:20px;overflow:hidden}
.bk .th img{width:100%;height:100%;object-fit:cover}
.bk .tx{flex:1;min-width:0}
.bk .tx b{display:block;font-weight:600}
.bk .tx small{color:var(--ink2)}
.bk .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;flex:none}
.modal .list{max-height:48vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.modal .create{border:1px dashed var(--accent);color:var(--accent);background:transparent}

.grp{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.grp > .eyebrow{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;min-height:0;flex:none;margin-top:1px;accent-color:var(--accent)}
.chk span{flex:1;font-size:15px;line-height:1.35}
.alert{background:#FDECEA;color:#8A2A1B;border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.alert b{display:block}
:root:not([data-theme="light"]) .alert{background:#3A1D16;color:#F3B6A8}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .alert{background:#FDECEA;color:#8A2A1B}}
:root[data-theme="dark"] .alert{background:#3A1D16;color:#F3B6A8}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px;text-align:center}
.kpi .v{font-family:"Barlow Condensed";font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-top:4px}
.kpi .d{font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.up{color:var(--ok)} .down{color:#C8402A}
.mrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .dt{font-family:"Barlow Condensed";font-weight:700;color:var(--accent);min-width:64px;font-variant-numeric:tabular-nums}
.mrow .vals{flex:1;font-variant-numeric:tabular-nums;font-size:14px}
.tagline{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div id="modal"></div>

<script>
/* ============ estado y almacenamiento (en este teléfono) ============ */
const LS='gymcoach.v1', LS_OLD='gymlog.v1';
const APP_VERSION='web11';
const STORAGE_MAX=5*1024*1024; let warnedFull=false;
let lastExport=0; try{ lastExport=+localStorage.getItem('gymcoach.lastExport')||0; }catch(e){}
let dlNs=undefined;
let state={clients:[],routines:[],logs:[],media:{},exmedia:{},bank:[],bankMedia:{}};
let REST=180, WEEK_GOAL=2;
try{ REST=+localStorage.getItem('gymlog.rest')||180; WEEK_GOAL=+localStorage.getItem('gymlog.goal')||2; }catch(e){}

function loadLocal(){
  try{
    let s=JSON.parse(localStorage.getItem(LS));
    if(!s){ const old=JSON.parse(localStorage.getItem(LS_OLD)); if(old){ s={...old,clients:[]}; } }
    if(s) state={...state,...s};
  }catch(e){}
  migrate();
}
function migrate(){
  state.bank=state.bank||[]; state.bankMedia=state.bankMedia||{};
  state.clients=state.clients||[]; state.routines=state.routines||[]; state.logs=state.logs||[]; state.media=state.media||{}; state.exmedia=state.exmedia||{};
  const orphan=state.logs.filter(l=>!l.clientId);
  if(orphan.length){ let c=state.clients.find(x=>x.id==='c_default'); if(!c){ c={id:'c_default',name:'Sin asignar',goal:'',notes:'',routineIds:[],created:Date.now()}; state.clients.push(c); } orphan.forEach(l=>l.clientId=c.id); }
  state.clients.forEach(c=>{ c.routineIds=(c.routineIds||[]).filter(id=>state.routines.some(r=>r.id===id)); });
  // toda foto puesta en un ejercicio alimenta el banco por nombre
  state.routines.forEach(r=>r.exercises.forEach(e=>{ const m=mediaOf(e); if(m&&state.media[m]&&!state.bankMedia[norm(e.name)]) state.bankMedia[norm(e.name)]=m; }));
}
function usedBytes(){ try{ return JSON.stringify(state).length; }catch(e){ return 0; } }
function saveLocalOnly(){
  try{ localStorage.setItem(LS, JSON.stringify(state)); return true; }
  catch(e){ ok('Memoria del teléfono llena','No se pudo guardar. Exporta una copia de seguridad ahora mismo y borra sesiones antiguas o fotos propias para liberar espacio.','Entendido'); return false; }
}
function save(){
  if(!saveLocalOnly()) return;
  const pct = usedBytes()/STORAGE_MAX;
  if(pct>0.75 && !warnedFull){ warnedFull=true; toast('Atención: memoria al '+Math.round(pct*100)+'%. Exporta una copia.'); }
  if(typeof scheduleSync==='function') scheduleSync();
}

/* ============ diálogos propios ============ */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ask(title,def='',opts={}){ return new Promise(res=>{ const m=document.getElementById('modal'); const type=opts.type||'text';
  m.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal"><h3>${esc(title)}</h3>${opts.hint?`<p>${esc(opts.hint)}</p>`:''}<input id="m-in" type="${type}" ${type==='number'?'inputmode="decimal" step="any"':''} value="${esc(def)}" placeholder="${esc(opts.placeholder||'')}"><div class="row"><button id="m-no">Cancelar</button><button class="primary" id="m-ok">${esc(opts.ok||'Aceptar')}</button></div></div></div>`;
  const inp=document.getElementById('m-in'); setTimeout(()=>{ inp.focus(); inp.select&&inp.select(); },50);
  const close=v=>{ m.innerHTML=''; res(v); };
  document.getElementById('m-ok').onclick=()=>close(inp.value.trim()||null);
  document.getElementById('m-no').onclick=()=>close(null);
  document.getElementById('mbg').onclick=e=>{ if(e.target.id==='mbg') close(null); };
  inp.onkeydown=e=>{ if(e.key==='Enter') close(inp.value.trim()||null); if(e.key==='Escape') close(null); }; }); }
function ok(title,hint,btn='Sí, continuar'){ return new Promise(res=>{ const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal"><h3>${esc(title)}</h3>${hint?`<p>${esc(hint)}</p>`:''}<div class="row"><button id="m-no">Cancelar</button><button class="primary" id="m-ok">${esc(btn)}</button></div></div></div>`;
  const close=v=>{ m.innerHTML=''; res(v); };
  document.getElementById('m-ok').onclick=()=>close(true); document.getElementById('m-no').onclick=()=>close(false);
  document.getElementById('mbg').onclick=e=>{ if(e.target.id==='mbg') close(false); }; }); }
function pick(title,items,hint){ return new Promise(res=>{ const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal"><h3>${esc(title)}</h3>${hint?`<p>${esc(hint)}</p>`:''}${items.length?items.map((it,i)=>`<button class="opt" data-i="${i}">${esc(it.label)}${it.sub?`<small>${esc(it.sub)}</small>`:''}</button>`).join(''):'<p>No hay opciones todavía.</p>'}<button id="m-no" class="ghost">Cancelar</button></div></div>`;
  const close=v=>{ m.innerHTML=''; res(v); };
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>close(items[+b.dataset.i].value));
  document.getElementById('m-no').onclick=()=>close(null);
  document.getElementById('mbg').onclick=e=>{ if(e.target.id==='mbg') close(null); }; }); }

/* ============ banco de ejercicios ============ */
const BANK_GROUPS=['Pecho','Espalda','Hombro','Bíceps','Tríceps','Pierna','Glúteo','Core','Cardio'];

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\(.*?\)/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function bankAll(){ const seen=new Set(); const out=[]; [...state.bank,...BANK].forEach(b=>{ const k=norm(b.name); if(seen.has(k)) return; seen.add(k); out.push(b); }); return out; }
function bankFind(name){ const k=norm(name); return bankAll().find(b=>norm(b.name)===k)||null; }
function bankMediaOf(name){ const m=state.bankMedia[norm(name)]; return m&&state.media[m]?m:null; }
function bankUse(name){ const k=norm(name); if(!k) return; if(!bankFind(name)) state.bank.push({name:name.trim(),group:'Otros',sets:3,reps:10}); }
function bankSearch(q){ const n=norm(q); const words=n.split(' ').filter(Boolean); return bankAll().filter(b=>{ const t=norm(b.name)+' '+norm(b.group); return words.every(w=>t.includes(w)); }); }
function pickExercise(title){ return new Promise(res=>{ const m=document.getElementById('modal'); let q='';
  const listHtml=()=>{ const items=(q?bankSearch(q):bankAll()).slice(0,q?40:200); const exact=q&&items.some(b=>norm(b.name)===norm(q));
    return (q&&!exact?`<button class="bk create" data-new="1"><div class="th">＋</div><div class="tx"><b>Crear “${esc(q.trim())}”</b><small>Se guarda en el banco para la próxima</small></div></button>`:'')+
      (items.length?items.map((b,i)=>{ const src=bankSrc(b.name); return `<button class="bk" data-i="${i}"><div class="th">${src?`<img src="${src}" alt="">`:'🏋️'}</div><div class="tx"><b>${esc(b.name)}</b><small>${b.sets}×${b.reps}${src?' · con foto':''}</small></div><div class="tag">${esc(b.group)}</div></button>`; }).join(''):'<div class="empty" style="padding:16px">Nada con ese nombre. Escríbelo y créalo.</div>'); };
  m.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal"><h3>${esc(title)}</h3><input id="m-in" placeholder="Buscar: press, remo, sentadilla…" autocomplete="off"><div class="list" id="m-list">${listHtml()}</div><button id="m-no" class="ghost">Cancelar</button></div></div>`;
  const inp=document.getElementById('m-in'); const list=document.getElementById('m-list'); setTimeout(()=>inp.focus(),50);
  const close=v=>{ m.innerHTML=''; res(v); };
  const bind=()=>{ list.querySelectorAll('.bk').forEach(b=>b.onclick=()=>{ if(b.dataset.new){ close({name:q.trim(),group:'Otros',sets:3,reps:10,isNew:true}); } else { const items=(q?bankSearch(q):bankAll()).slice(0,q?40:200); close(items[+b.dataset.i]); } }); };
  bind(); inp.oninput=()=>{ q=inp.value; list.innerHTML=listHtml(); bind(); };
  inp.onkeydown=e=>{ if(e.key==='Enter'&&q.trim()){ const items=bankSearch(q); close(items[0]&&norm(items[0].name)===norm(q)?items[0]:{name:q.trim(),group:'Otros',sets:3,reps:10,isNew:true}); } if(e.key==='Escape') close(null); };
  document.getElementById('m-no').onclick=()=>close(null);
  document.getElementById('mbg').onclick=e=>{ if(e.target.id==='mbg') close(null); }; }); }

const mmss=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
const client=id=>state.clients.find(c=>c.id===id);
const routine=id=>state.routines.find(r=>r.id===id);

const mediaOf=ex=>ex.noMedia?null:(state.exmedia[ex.id]||ex.mediaId||state.bankMedia[norm(ex.name)]||null);
function bankSrc(name){ const m=state.bankMedia[norm(name)]; if(m&&state.media[m]) return state.media[m]; return BUILTIN[norm(name)]||null; }
function exSrc(ex){ if(ex.noMedia) return null; const m=state.exmedia[ex.id]||ex.mediaId; if(m&&state.media[m]) return state.media[m]; return bankSrc(ex.name); }
function embed(url){
  if(!url) return '';
  const yt=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{6,})/);
  if(yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen loading="lazy"></iframe>`;
  if(/\.(mp4|webm|mov)(\?|$)/i.test(url)) return `<video src="${esc(url)}" controls playsinline></video>`;
  return `<a href="${esc(url)}" target="_blank" rel="noopener" style="padding:20px;color:var(--accent);font-weight:600">Abrir video ↗</a>`;
}
function mediaHtml(ex){ const src=exSrc(ex); if(src) return `<img src="${src}" alt="${esc(ex.name)}">`; if(ex.videoUrl) return embed(ex.videoUrl); return '<span>Sin imagen</span>'; }
function thumbHtml(ex){ const src=exSrc(ex); if(src) return `<img src="${src}" alt="">`; if(ex.videoUrl) return '▶'; return '🏋️'; }
function compressImage(file,max=640,q=.72){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ let w=img.width,h=img.height; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k); const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',q)); }; img.onerror=rej; img.src=u; }); }
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();

/* ============ ficha del cliente ============ */
const GOALS=['Bajar grasa','Ganar músculo','Ganar fuerza','Mejorar técnica','Salud general','Rendimiento deportivo','Rehabilitación'];
const LEVELS=['Principiante','Intermedio','Avanzado'];
const PARQ=[['corazon','Problema del corazón o presión alta'],
            ['pecho','Dolor en el pecho al hacer esfuerzo'],
            ['mareo','Mareos o pérdida de equilibrio'],
            ['hueso','Lesión de huesos o articulaciones que empeora al entrenar'],
            ['medic','Toma medicamentos recetados'],
            ['embarazo','Embarazo o parto hace menos de 6 meses']];
const MEAS=[['weight','Peso','kg'],['height','Altura','cm'],['fat','Grasa','%'],
            ['waist','Cintura','cm'],['hip','Cadera','cm'],['chest','Pecho','cm'],
            ['arm','Brazo','cm'],['thigh','Muslo','cm']];
const prof=c=>(c.profile=c.profile||{});
const meas=c=>(c.measures=c.measures||[]);
function ageOf(c){ const b=prof(c).birth; if(!b) return null; const d=new Date(b); if(isNaN(d)) return null;
  const t=new Date(); let a=t.getFullYear()-d.getFullYear(); const m=t.getMonth()-d.getMonth();
  if(m<0||(m===0&&t.getDate()<d.getDate())) a--; return a>=0&&a<120?a:null; }
function lastMeas(c,key){ const l=meas(c).filter(m=>m[key]!=null&&m[key]!=='').sort((a,b)=>b.date-a.date); return l[0]||null; }
function heightOf(c){ const m=lastMeas(c,'height'); return m?+m.height:(prof(c).height?+prof(c).height:null); }
function bmiOf(c){ const w=lastMeas(c,'weight'), h=heightOf(c); if(!w||!h) return null; const b=+w.weight/Math.pow(h/100,2); return isFinite(b)?Math.round(b*10)/10:null; }
const bmiLabel=b=>b==null?'':(b<18.5?'Bajo peso':b<25?'Normal':b<30?'Sobrepeso':'Obesidad');
function parqFlags(c){ const h=prof(c).health||{}; return PARQ.filter(([k])=>h[k]).map(([,t])=>t); }
function weightSeries(c){ return meas(c).filter(m=>m.weight).sort((a,b)=>a.date-b.date).map(m=>+m.weight); }

/* ============ datos por cliente ============ */
const logsOf=cid=>state.logs.filter(l=>l.clientId===cid);
function lastEntry(exId,cid){ const logs=logsOf(cid).sort((a,b)=>b.date-a.date); for(const l of logs){ const sets=(l.entries||{})[exId]; if(sets&&sets.some(s=>s.reps||s.weight)) return {date:l.date,sets:sets.filter(s=>s.reps||s.weight)}; } return null; }
function bestWeight(exId,cid){ let b=0; logsOf(cid).forEach(l=>((l.entries||{})[exId]||[]).forEach(s=>{ if(+s.weight>b) b=+s.weight; })); return b; }
function volume(log){ let v=0; Object.values(log.entries||{}).forEach(sets=>sets.forEach(s=>v+=(+s.reps||0)*(+s.weight||0))); return v; }
function exStats(sets){ const w=Math.max(0,...sets.map(s=>+s.weight||0)); const reps=sets.reduce((a,s)=>a+(+s.reps||0),0); const atMax=sets.filter(s=>+s.weight===w).reduce((a,s)=>a+(+s.reps||0),0); return {w,reps,atMax,n:sets.length}; }
function prevLogWith(exId,cid,before){ return logsOf(cid).filter(l=>l.date<before&&(l.entries||{})[exId]).sort((a,b)=>b.date-a.date)[0]||null; }
function feedback(log){ const out=[]; let ups=0; const cid=log.clientId;
  for(const [id,sets] of Object.entries(log.entries||{})){ const e=exById(id); const name=e?e.name:'Ejercicio'; const cur=exStats(sets); const prevLog=prevLogWith(id,cid,log.date); const target=e&&e.reps?e.reps:null;
    if(!prevLog){ out.push({ico:'📌',t:`${name}: marca base ${cur.w} kg × ${cur.atMax} reps`,s:'Primera vez registrado. Desde aquí medimos el progreso.'}); continue; }
    const prev=exStats(prevLog.entries[id]); const dw=cur.w-prev.w;
    if(dw>0){ ups++; out.push({ico:'🏆',t:`Subió ${dw} kg en ${name}`,s:`De ${prev.w} kg a ${cur.w} kg. ${cur.atMax<(target||0)?`Ahora consolidar: llegar a ${target} reps con este peso.`:'Excelente, mantener la técnica.'}`}); }
    else if(dw<0){ out.push({ico:'↩️',t:`${name}: bajó ${-dw} kg`,s:'Hay días así. Objetivo: volver a '+prev.w+' kg la próxima.'}); }
    else if(cur.reps>prev.reps){ ups++; out.push({ico:'💪',t:`${name}: mismo peso, ${cur.reps-prev.reps} reps más`,s:`${cur.reps} reps en total vs ${prev.reps}. ${target&&cur.atMax>=target*cur.n?`Ya domina las ${target} reps: la próxima subir el peso.`:'Va ganando fuerza.'}`}); }
    else if(cur.reps<prev.reps){ out.push({ico:'🎯',t:`${name}: menos reps que la vez pasada`,s:`${cur.reps} vs ${prev.reps} reps con ${cur.w} kg. Nuevo objetivo: ${prev.reps} reps o más.`}); }
    else { out.push({ico:'➖',t:`${name}: igual que la vez pasada`,s:`${cur.w} kg × ${cur.atMax} reps. ${target&&cur.atMax>=target*cur.n?'Ya cumple el objetivo: intentar subir 2,5 kg.':'Intentar una rep más por serie.'}`}); } }
  const prevSame=logsOf(cid).filter(l=>l.date<log.date&&l.routineId===log.routineId).sort((a,b)=>b.date-a.date)[0];
  if(prevSame){ const v=volume(log), pv=volume(prevSame); const d=pv>0?Math.round((v-pv)/pv*100):0; if(pv>0&&d!==0) out.unshift({ico:d>0?'📈':'📉',t:`Volumen total ${d>0?'+':''}${d}% vs la sesión anterior`,s:`${v.toLocaleString('es')} kg movidos frente a ${pv.toLocaleString('es')} kg.`}); }
  if(ups>=2) out.unshift({ico:'🔥',t:`Gran sesión: progresó en ${ups} ejercicios`,s:'Así se construye. Descanso y proteína.'});
  return out; }
function fbHtml(list){ return list.map(f=>`<div class="fb"><div class="ico">${f.ico}</div><div class="tx"><b>${esc(f.t)}</b><small>${esc(f.s)}</small></div></div>`).join(''); }
function weekStart(ts){ const d=new Date(ts); d.setHours(0,0,0,0); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.getTime(); }
function weekInfo(cid){ const ws=weekStart(Date.now()); const L=logsOf(cid); const thisW=L.filter(l=>l.date>=ws).length; const lastW=L.filter(l=>l.date>=ws-7*864e5&&l.date<ws).length; const last=[...L].sort((a,b)=>b.date-a.date)[0]; const days=last?Math.floor((Date.now()-last.date)/864e5):null; return {thisW,lastW,days,last}; }
function bannerHtml(cid){ const c=client(cid); const goal=c.weekGoal||WEEK_GOAL; const w=weekInfo(cid); const left=goal-w.thisW; let title,sub;
  if(w.thisW>=goal){ title='¡Meta de la semana cumplida!'; sub=`${w.thisW} de ${goal} entrenamientos registrados.`; }
  else if(w.days===null){ title='Sin entrenamientos todavía'; sub=`Meta: ${goal} por semana.`; }

async function sb(path, opts={}, withAuth=true){

  if(withAuth&&auth) h.Authorization='Bearer '+auth.access_token;
  const r=await fetch(SB_URL+path,{...opts,headers:h});

  return txt?JSON.parse(txt):null;
}
async function cloudLogin(email,password){

/* --- detectar qué cambió desde la última sincronización --- */
const sig=o=>{ const c={...o}; delete c._m; return JSON.stringify(c); };
const bankSig=()=>JSON.stringify([state.bank,state.bankMedia,Object.keys(state.media).sort()]);
function stampChanges(){
  const t=Date.now(); let n=0;
  const walk=(arr,pfx)=>arr.forEach(o=>{ const k=pfx+o.id, j=sig(o); if(snap[k]!==j){ o._m=t; n++; } });
  walk(state.clients,'c:'); walk(state.routines,'r:'); walk(state.logs,'l:');
  if(snap['bank']!==bankSig()){ state.bankM=t; n++; }
  return n;
}
function markDel(kind,id){ state.dels=state.dels||[]; if(!state.dels.includes(kind+':'+id)) state.dels.push(kind+':'+id); }

/* --- sincronizar --- */
function scheduleSync(){ if(!auth) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(), 2500); }
async function syncNow(manual){
  if(!auth||syncBusy) return;
  if(!navigator.onLine){ syncMsg='Sin conexión'; if(view.name==='settings') render(); return; }
  syncBusy=true; syncMsg='Sincronizando…'; if(view.name==='settings') render();
  try{
    if(!await freshToken()) throw {msg:'Sesión vencida, vuelve a entrar'};
    stampChanges();
    // borrados pendientes
    for(const d of (state.dels||[])){
      const [k,id]=d.split(':'); const tbl=k==='c'?'clients':k==='r'?'routines':'logs';
      try{ await sb(`/rest/v1/${tbl}?id=eq.${encodeURIComponent(id)}`,{method:'DELETE'}); }catch(e){ if(e.status!==404) throw e; }
    }
    state.dels=[];
    // bajar
    const [rc,rr,rl,rb]=await Promise.all([
      sb('/rest/v1/clients?select=*'), sb('/rest/v1/routines?select=*'),
      sb('/rest/v1/logs?select=*'), sb('/rest/v1/bank?select=*')]);
    const mergeList=(remote,local,conv,pfx)=>{
      const by={}; local.forEach(o=>by[o.id]=o);
      remote.forEach(x=>{ const l=by[x.id]; const inc=conv(x);
        if(!l){ local.push(inc); by[x.id]=inc; }
        else if((x.m||0)>(l._m||0)){ Object.keys(l).forEach(k=>delete l[k]); Object.assign(l,inc); } });
    };
    mergeList(rc,state.clients,cIn,'c:'); mergeList(rr,state.routines,rIn,'r:'); mergeList(rl,state.logs,lIn,'l:');
    if(rb&&rb[0]&&(rb[0].m||0)>(state.bankM||0)){ const d=rb[0].data||{};
      state.bank=d.bank||state.bank; state.bankMedia={...state.bankMedia,...(d.bankMedia||{})}; state.media={...state.media,...(d.media||{})}; state.bankM=rb[0].m; }
    migrate();
    // subir lo que sea más nuevo aquí
    const up=(arr,conv,pfx,tbl)=>{ const pend=arr.filter(o=>{ const k=pfx+o.id; return snap[k]!==sig(o); }).map(conv);
      return pend.length? sb(`/rest/v1/${tbl}`,{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify(pend)}) : null; };
    await Promise.all([ up(state.clients,cOut,'c:','clients'), up(state.routines,rOut,'r:','routines'), up(state.logs,lOut,'l:','logs') ].filter(Boolean));
    if(snap['bank']!==bankSig()){
      await sb('/rest/v1/bank',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},
        body:JSON.stringify([{data:{bank:state.bank,bankMedia:state.bankMedia,media:state.media},m:state.bankM||Date.now()}])});
    }
    snap={}; state.clients.forEach(o=>snap['c:'+o.id]=sig(o)); state.routines.forEach(o=>snap['r:'+o.id]=sig(o)); state.logs.forEach(o=>snap['l:'+o.id]=sig(o)); snap['bank']=bankSig();
    saveSnap(); saveLocalOnly();
    syncMsg='Al día · '+new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
    if(manual) toast('Sincronizado con la nube');
  }catch(e){
    syncMsg='Error: '+((e&&e.msg)||'no se pudo sincronizar');
    if(manual) toast(syncMsg);
  }finally{ syncBusy=false; render(); }
}

  const grafico=ws.length>1?`<div class="card" style="padding:14px"><div class="eyebrow">Peso · ${ws[0]} kg → ${ws[ws.length-1]} kg</div><div style="margin-top:8px">${spark(ws)}</div></div>`:'';
  shell('Medidas',esc(c.name),`
    ${grafico}
    <button class="big primary" onclick="addMeasure('${c.id}')">+ Registrar medidas de hoy</button>
    ${rows?`<div class="card" style="padding:4px 14px">${rows}</div>`:`<div class="empty"><div class="big-ico">📏</div>Sin medidas todavía.<br>Registra el peso y la altura para empezar a medir el progreso.</div>`}`,
    {back:`go({name:'client',id:'${c.id}'})`});
};
function addMeasure(cid){
  const c=client(cid); const last=meas(c).slice().sort((a,b)=>b.date-a.date)[0]||{};
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal"><h3>Medidas de hoy</h3>
    <p>Deja en blanco lo que no midas.</p>
    <div class="two">${MEAS.map(([k,l,u])=>`<div class="field"><label class="lbl">${l} (${u})</label><input id="m-${k}" type="number" inputmode="decimal" step="0.1" placeholder="${last[k]!=null&&last[k]!==''?last[k]:''}"></div>`).join('')}</div>
    <div class="field"><label class="lbl">Observación</label><input id="m-note" placeholder="Opcional"></div>
    <div class="row"><button id="m-no">Cancelar</button><button class="primary" id="m-ok">Guardar</button></div></div></div>`;
  const close=()=>{ m.innerHTML=''; };
  document.getElementById('m-no').onclick=close;
  document.getElementById('mbg').onclick=e=>{ if(e.target.id==='mbg') close(); };
  document.getElementById('m-ok').onclick=()=>{
    const rec={id:uid(),date:Date.now()}; let any=false;
    MEAS.forEach(([k])=>{ const e=document.getElementById('m-'+k); const val=e&&e.value.trim(); if(val){ rec[k]=+val; any=true; } });
    const n=document.getElementById('m-note').value.trim(); if(n){ rec.note=n; any=true; }
    if(!any){ toast('No escribiste ninguna medida'); return; }
    if(rec.height) prof(c).height=String(rec.height);
    meas(c).push(rec); save(); close(); render(); toast('Medidas guardadas');
  };
  setTimeout(()=>{ const f=document.getElementById('m-weight'); if(f) f.focus(); },60);
}
async function delMeasure(cid,mid){
  const c=client(cid); if(!await ok('¿Borrar este registro de medidas?','','Borrar')) return;
  c.measures=meas(c).filter(x=>x.id!==mid); save(); render();
}

async function pickImage(inp){ const f=inp.files[0]; if(!f) return; toast('Procesando foto…'); try{ const data=await compressImage(f); const id=uid(); state.media[id]=data; state.exmedia[view.eid]=id; { const r0=routine(view.rid); const e0=r0&&r0.exercises.find(x=>x.id===view.eid); if(e0) delete e0.noMedia; } const rr=routine(view.rid); const ee=rr&&rr.exercises.find(x=>x.id===view.eid); if(ee){ state.bankMedia[norm(ee.name)]=id; bankUse(ee.name); } save(); const r=routine(view.rid); const e=r.exercises.find(x=>x.id===view.eid); const m=document.getElementById('media'); if(m&&e) m.innerHTML=mediaHtml(e); render(); toast('Foto guardada'); }catch(err){ toast('No se pudo guardar la foto'); } }
function clearMedia(){ const r=routine(view.rid); const e=r.exercises.find(x=>x.id===view.eid); delete state.exmedia[e.id]; e.mediaId=null; e.noMedia=true; gcMedia(); save(); render(); }
function gcMedia(){ const used=new Set([...Object.values(state.exmedia),...Object.values(state.bankMedia)]); state.routines.forEach(r=>r.exercises.forEach(e=>{ if(e.mediaId) used.add(e.mediaId); })); Object.keys(state.media).forEach(k=>{ if(!used.has(k)) delete state.media[k]; }); }
function saveEx(){ const r=routine(view.rid); const e=r.exercises.find(x=>x.id===view.eid); e.name=document.getElementById('f-name').value.trim()||e.name; e.sets=+document.getElementById('f-sets').value||0; e.reps=+document.getElementById('f-reps').value||0; e.videoUrl=document.getElementById('f-video').value.trim(); e.notes=document.getElementById('f-notes').value.trim(); bankUse(e.name); const cm=mediaOf(e); if(cm&&!state.bankMedia[norm(e.name)]) state.bankMedia[norm(e.name)]=cm; save(); toast('Guardado'); go({name:'routine',id:r.id,from:view.from||''}); }
async function removeEx(){ const r=routine(view.rid); const e=r.exercises.find(x=>x.id===view.eid); if(!await ok(`¿Quitar “${e.name}”?`,'Se quita de esta rutina. Los registros anteriores se conservan.','Quitar')) return; r.exercises=r.exercises.filter(x=>x.id!==e.id); delete state.exmedia[e.id]; gcMedia(); save(); go({name:'routine',id:r.id,from:view.from||''}); }

  const rows=items.map(b=>{ const src=bankSrc(b.name); return `<button class="bk" onclick="bankItem('${esc(b.name).replace(/'/g,"\\'")}')"><div class="th">${src?`<img src="${src}" alt="">`:'🏋️'}</div><div class="tx"><b>${esc(b.name)}</b><small>${b.sets}×${b.reps}${b.builtin?'':' · creado por ti'}${src?' · 📷':''}</small></div><div class="tag">${esc(b.group)}</div></button>`; }).join('');
  shell('Banco de ejercicios',`${items.length} ejercicios`,`

function renderKeep(id){ const el=document.getElementById(id); const pos=el.selectionStart; render(); const n=document.getElementById(id); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
let bankTarget=null;
async function bankItem(name){ const b=bankFind(name); if(!b) return; const src=bankSrc(name);
  const act=await pick(b.name,[{label:src?'Cambiar foto':'📷 Poner foto',sub:'Desde la cámara o la galería',value:'photo'},...(src?[{label:'Quitar foto',value:'clear'}]:[]),...(b.builtin?[]:[{label:'Renombrar',value:'rename'},{label:'Eliminar del banco',value:'del'}])],`${b.group} · ${b.sets}×${b.reps} por defecto`); if(!act) return;
  if(act==='photo'){ bankTarget=b.name; let f=document.getElementById('bk-file'); if(!f){ f=document.createElement('input'); f.type='file'; f.accept='image/*'; f.id='bk-file'; f.hidden=true; f.onchange=bankPhoto; document.body.appendChild(f); } f.value=''; f.click(); }
  else if(act==='clear'){ delete state.bankMedia[norm(name)]; gcMedia(); save(); render(); }
  else if(act==='rename'){ const n=await ask('Renombrar',b.name,{ok:'Guardar'}); if(n){ const m=state.bankMedia[norm(b.name)]; delete state.bankMedia[norm(b.name)]; b.name=n; if(m) state.bankMedia[norm(n)]=m; save(); render(); } }
  else if(act==='del'){ if(await ok('¿Eliminar del banco?','Las rutinas que ya lo usan no cambian.','Eliminar')){ state.bank=state.bank.filter(x=>x!==b); delete state.bankMedia[norm(b.name)]; gcMedia(); save(); render(); } } }
async function bankPhoto(ev){ const f=ev.target.files[0]; if(!f||!bankTarget) return; toast('Procesando foto…'); try{ const data=await compressImage(f); const id=uid(); state.media[id]=data; state.bankMedia[norm(bankTarget)]=id; bankUse(bankTarget); state.routines.forEach(r=>r.exercises.forEach(e=>{ if(norm(e.name)===norm(bankTarget)&&!mediaOf(e)) state.exmedia[e.id]=id; })); save(); render(); toast('Foto guardada en el banco'); }catch(e){ toast('No se pudo guardar la foto'); } }

function exportNames(){ const lines=['# Nombra cada imagen con el nombre de archivo de la derecha.','# Ejemplo: sentadilla-con-barra.jpg','',...bankAll().map(b=>`${b.group}\t${b.name}\t${norm(b.name).replace(/ /g,'-')}.jpg`)];
  saveFile('nombres-ejercicios.txt', lines.join(String.fromCharCode(10)), 'text/plain'); }
async function bulkImport(inp){ const files=[...inp.files]; inp.value=''; if(!files.length) return;
  const all=bankAll(); const matched=[],failed=[];
  for(const f of files){ const base=norm(f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' '));
    let hit=all.find(b=>norm(b.name)===base);
    if(!hit){ const c=all.filter(b=>norm(b.name).includes(base)||base.includes(norm(b.name))); if(c.length===1) hit=c[0]; }
    if(hit) matched.push([f,hit]); else failed.push(f.name); }
  if(!matched.length){ await ok('Ningún nombre coincidió',`Revisé ${files.length} archivo${files.length!==1?'s':''} y ninguno coincide con un ejercicio del banco. Descarga la lista de nombres y renómbralos así.`,'Entendido'); return; }
  if(!await ok(`¿Cargar ${matched.length} foto${matched.length!==1?'s':''}?`,(failed.length?`No coincidieron ${failed.length}: ${failed.slice(0,4).join(', ')}${failed.length>4?'…':''}. `:'')+'Las fotos se reducen para que quepan en el teléfono.','Cargar')) return;
  let done=0;
  for(const [f,b] of matched){ try{ const data=await compressImage(f,480,.7); const id=uid(); state.media[id]=data; state.bankMedia[norm(b.name)]=id; bankUse(b.name);
      state.routines.forEach(r=>r.exercises.forEach(e=>{ if(norm(e.name)===norm(b.name)&&!mediaOf(e)) state.exmedia[e.id]=id; }));
      done++; toast(`Cargando ${done} de ${matched.length}…`); }catch(e){ failed.push(f.name); } }
  try{ save(); }catch(e){}
  const kb=Math.round(JSON.stringify(state).length/1024);
  render(); await ok(`${done} foto${done!==1?'s':''} cargada${done!==1?'s':''}`,`El banco ocupa ahora ${kb} KB.${kb>4000?' Cuidado: cerca del límite del teléfono. Exporta una copia de seguridad y considera usar menos fotos.':''}${failed.length?` No se pudieron asignar ${failed.length}.`:''}`,'Listo'); }

let session=null, tickId=null;
async function startWorkoutPick(rid){ const opts=state.clients.map(c=>({label:c.name,sub:c.goal||'',value:c.id})); if(!opts.length){ if(await ok('No hay clientes','Crea primero un cliente en la pestaña Clientes.','Ir a Clientes')) go({name:'clients'}); return; } const cid=await pick('¿Con qué cliente?',opts); if(!cid) return; const c=client(cid); if(!c.routineIds.includes(rid)){ c.routineIds.push(rid); save(); } startWorkout(rid,cid); }
function startWorkout(rid,cid){ const r=routine(rid); const c=client(cid); if(!r||!c) return;
  const entries={}; r.exercises.forEach(e=>{ entries[e.id]=Array.from({length:e.sets||3},()=>({reps:'',weight:''})); });
  session={id:uid(),date:Date.now(),clientId:cid,clientName:c.name,routineId:r.id,routineName:r.name,entries,idx:0,rest:null}; startTick(); go({name:'workout'}); }
VIEWS.workout=function(){
  if(!session) return go({name:'clients'});
  const r=routine(session.routineId); const e=r.exercises[session.idx]; const sets=session.entries[e.id]; const last=lastEntry(e.id,session.clientId);
  const done=Object.values(session.entries).flat().filter(s=>s.reps||s.weight).length, total=Object.values(session.entries).flat().length;
  const rows=sets.map((s,i)=>`<div class="n">${i+1}</div><input type="number" inputmode="decimal" placeholder="${last&&last.sets[i]?last.sets[i].reps:(e.reps||'')}" value="${s.reps}" class="${s.reps?'filled':''}" oninput="setVal(${i},'reps',this.value)"><input type="number" inputmode="decimal" step="0.5" placeholder="${last&&last.sets[i]?last.sets[i].weight:''}" value="${s.weight}" class="${s.weight?'filled':''}" oninput="setVal(${i},'weight',this.value)"><button class="icon ${s.done?'done':''}" onclick="completeSet(${i})" aria-label="Serie hecha">✓</button>`).join('');
  shell(esc(session.clientName),`${esc(r.name)} · ejercicio ${session.idx+1} de ${r.exercises.length}`,`
    ${timerHtml()}
    <div class="progress"><i style="width:${total?done/total*100:0}%"></i></div>
    <div class="chips">${r.exercises.map((x,i)=>`<button class="chip ${i===session.idx?'on':''}" onclick="session.idx=${i};render()">${esc(x.name)}</button>`).join('')}</div>
    <div class="card wex">
      <div class="media" style="margin-bottom:12px">${mediaHtml(e)}</div>
      <h2>${esc(e.name)}</h2>
      <div class="last">${last?`Última vez (${fmtDate(last.date)}): <b>${last.sets.map(s=>`${s.reps}×${s.weight}kg`).join(' · ')}</b>`:'Primera vez que registra este ejercicio'}${e.notes?`<br>📝 ${esc(e.notes)}`:''}</div>
      <div class="sets"><div></div><div class="h">Reps</div><div class="h">Peso kg</div><div></div>${rows}</div>
      <div class="row" style="margin-top:12px"><button class="ghost" onclick="addSet()">+ Serie</button><button class="ghost" onclick="removeSet()">– Serie</button><button class="ghost" onclick="setRest()">⏱ ${Math.round(REST/60*10)/10} min</button></div>
    </div>
    <div class="stickybar"><div class="in">
      <button onclick="session.idx=Math.max(0,session.idx-1);render()" ${session.idx===0?'disabled':''}>‹ Anterior</button>
      ${session.idx<r.exercises.length-1?`<button class="primary" onclick="session.idx++;render()">Siguiente ›</button>`:`<button class="primary" onclick="finishWorkout()">✓ Terminar</button>`}
    </div></div>`,
    {back:"cancelWorkout()",nav:false,right:`<button class="ghost" onclick="finishWorkout()">Terminar</button>`});
};
const currentEx=()=>routine(session.routineId).exercises[session.idx];
function setVal(i,k,v){ session.entries[currentEx().id][i][k]=v; }
function completeSet(i){ const e=currentEx(); const sets=session.entries[e.id]; const st=sets[i]; const last=lastEntry(e.id,session.clientId);
  if(!st.reps&&!st.weight){ const src=(i>0&&(sets[i-1].reps||sets[i-1].weight))?sets[i-1]:(last&&(last.sets[i]||last.sets.slice(-1)[0])); if(src){ st.reps=src.reps; st.weight=src.weight; } else { st.reps=e.reps||''; } }
  if(st.done){ st.done=false; render(); return; }
  st.done=true; session.rest={endsAt:Date.now()+REST*1000,total:REST,fired:false}; render(); }
function skipRest(){ session.rest=null; render(); }
function addRest(sec){ if(session.rest){ session.rest.endsAt+=sec*1000; session.rest.total+=sec; session.rest.fired=false; } else { session.rest={endsAt:Date.now()+sec*1000,total:sec,fired:false}; } render(); }
async function setRest(){ const m=await ask('Descanso entre series',(REST/60).toString(),{type:'number',hint:'En minutos. Ej. 3 o 2.5',ok:'Guardar'}); if(!m) return; const v=parseFloat(m.replace(',','.')); if(v>0){ REST=Math.round(v*60); try{ localStorage.setItem('gymlog.rest',REST); }catch(e){} render(); } }
function addSet(){ session.entries[currentEx().id].push({reps:'',weight:''}); render(); }
function removeSet(){ const s=session.entries[currentEx().id]; if(s.length>1){ s.pop(); render(); } }
function timerHtml(){ const el=(Date.now()-session.date)/1000; const r=session.rest; let cls='timerbar',big=mmss(el),lab='Tiempo total',sub='',ring='';
  if(r){ const left=(r.endsAt-Date.now())/1000; if(left>0){ cls+=' resting'; big=mmss(left); lab='Descanso'; sub='Total '+mmss(el); ring=`<div class="ring"><i id="ring" style="width:${left/r.total*100}%"></i></div>`; } else { cls+=' done'; big='¡Vamos!'; lab='Descanso terminado'; sub='Total '+mmss(el); } }
  return `<div class="${cls}" id="timerbar"><div class="t" id="t-big">${big}</div><div class="lab" id="t-lab">${lab}<b id="t-sub">${sub}</b>${ring}</div><div class="acts">${r?`<button onclick="addRest(30)">+30s</button><button onclick="skipRest()">Saltar</button>`:`<button onclick="addRest(REST)">Descansar</button>`}</div></div>`; }
function startTick(){ clearInterval(tickId); tickId=setInterval(()=>{ if(!session||view.name!=='workout') return; const r=session.rest; const el=(Date.now()-session.date)/1000; const big=document.getElementById('t-big'); if(!big) return;
  if(r){ const left=(r.endsAt-Date.now())/1000; if(left>0){ big.textContent=mmss(left); const sub=document.getElementById('t-sub'); if(sub) sub.textContent='Total '+mmss(el); const ring=document.getElementById('ring'); if(ring) ring.style.width=(left/r.total*100)+'%'; } else if(!r.fired){ r.fired=true; alarm(); render(); } }
  else big.textContent=mmss(el); },1000); }
function alarm(){ try{ navigator.vibrate&&navigator.vibrate([300,150,300,150,500]); }catch(e){} try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); [0,.25,.5].forEach(t=>{ const o=ac.createOscillator(), g=ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value=880; g.gain.setValueAtTime(.4,ac.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.2); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+.22); }); }catch(e){} }
async function cancelWorkout(){ if(await ok('¿Salir sin guardar?','Se perderán las series de este entrenamiento.','Salir')){ const cid=session.clientId; session=null; clearInterval(tickId); go({name:'client',id:cid}); } }
function finishWorkout(){
  const entries={}; let any=false; for(const [k,sets] of Object.entries(session.entries)){ const f=sets.filter(s=>s.reps||s.weight).map(s=>({reps:+s.reps||0,weight:+s.weight||0})); if(f.length){ entries[k]=f; any=true; } }
  if(!any){ toast('No se registró nada'); return; }
  const log={id:session.id,date:session.date,clientId:session.clientId,clientName:session.clientName,routineId:session.routineId,routineName:session.routineName,entries,duration:Math.round((Date.now()-session.date)/1000)};
  state.logs.push(log); save(); session=null; clearInterval(tickId); toast('¡Entrenamiento guardado! 💪'); go({name:'logDetail',id:log.id});
}

/* ============ HISTORIAL Y PROGRESO ============ */
VIEWS.history=function(){
  const cid=view.cid; const c=cid&&client(cid);
  const logs=(c?logsOf(cid):[...state.logs]).sort((a,b)=>b.date-a.date);
  shell(c?'Historial':'Historial',c?esc(c.name):`${logs.length} entrenamientos · todos los clientes`,
    logs.length?`<div class="card">${logs.map(l=>`<button class="hist" onclick="go({name:'logDetail',id:'${l.id}'})"><div class="d">${fmtDate(l.date)}</div><div class="r">${c?'':`<b>${esc(l.clientName||(client(l.clientId)||{}).name||'')}</b> · `}${esc(l.routineName)}<small>${Object.keys(l.entries).length} ejercicios · ${Object.values(l.entries).flat().length} series${l.duration?' · '+mmss(l.duration)+' min':''}</small></div><div class="vol">${volume(l).toLocaleString('es')} kg<br><small>volumen</small></div></button>`).join('')}</div>`:`<div class="empty"><div class="big-ico">📅</div>Aquí aparecen los entrenamientos terminados.</div>`,
    {back:c?`go({name:'client',id:'${cid}'})`:undefined});
};
VIEWS.logDetail=function(){
  const l=state.logs.find(x=>x.id===view.id); if(!l) return go({name:'history'});
  const c=client(l.clientId); const nameOf=id=>{ const e=exById(id); return e?e.name:'Ejercicio eliminado'; };
  shell(esc(c?c.name:l.clientName||'Sesión'),`${esc(l.routineName)} · ${fmtLong(l.date)}`,`
    <div class="card" style="padding:4px 14px">${Object.entries(l.entries).map(([id,sets])=>`<div class="detail-row"><div><b>${esc(nameOf(id))}</b></div><div style="text-align:right;color:var(--ink2)">${sets.map(s=>`${s.reps}×${s.weight}kg`).join('<br>')}</div></div>`).join('')}</div>
    <div class="eyebrow">Volumen total: ${volume(l).toLocaleString('es')} kg${l.duration?' · '+mmss(l.duration)+' min':''}</div>
    <div class="eyebrow">Resumen de progreso</div>
    <div class="card" style="padding:4px 14px">${fbHtml(feedback(l))}</div>
    <button class="danger" onclick="ok('¿Borrar este registro?','Esta sesión desaparecerá del historial.','Borrar').then(y=>{ if(y){ markDel('l','${l.id}'); state.logs=state.logs.filter(x=>x.id!=='${l.id}'); save(); go({name:'client',id:'${l.clientId}'}); } })">Borrar registro</button>`,
    {back:c?`go({name:'client',id:'${c.id}'})`:"go({name:'history'})"});
};
VIEWS.stats=function(){
  const c=client(view.cid); if(!c) return go({name:'clients'});
  const L=logsOf(c.id); const wi=weekInfo(c.id); const ws=weekStart(Date.now());
  const vw=L.filter(l=>l.date>=ws).reduce((a,l)=>a+volume(l),0), vl=L.filter(l=>l.date>=ws-7*864e5&&l.date<ws).reduce((a,l)=>a+volume(l),0);
  const weekCard=L.length?`<div class="card" style="padding:14px"><div class="eyebrow">Esta semana vs la anterior</div><div class="row" style="margin-top:8px"><div><div style="font-family:'Barlow Condensed';font-size:30px;font-weight:700">${wi.thisW}<small style="font-size:14px;color:var(--ink2)"> / ${c.weekGoal||WEEK_GOAL} sesiones</small></div><small style="color:var(--ink2)">semana pasada: ${wi.lastW}</small></div><div style="text-align:right"><div style="font-family:'Barlow Condensed';font-size:30px;font-weight:700">${vw.toLocaleString('es')}<small style="font-size:14px;color:var(--ink2)"> kg</small></div><small style="color:var(--ink2)">${vl?(vw>=vl?'+':'')+Math.round((vw-vl)/vl*100)+'% vs '+vl.toLocaleString('es')+' kg':'sin datos previos'}</small></div></div></div>`:'';
  const exIds=[...new Set(L.flatMap(l=>Object.keys(l.entries)))];
  const rows=exIds.map(id=>{ const e=exById(id); const name=e?e.name:'Ejercicio eliminado'; const pts=[...L].sort((a,b)=>a.date-b.date).map(l=>({d:l.date,w:Math.max(0,...((l.entries||{})[id]||[]).map(s=>+s.weight||0))})).filter(p=>p.w>0); if(!pts.length) return ''; const best=Math.max(...pts.map(p=>p.w)); const lastW=pts[pts.length-1].w; const gain=lastW-pts[0].w;
    return `<div class="detail-row"><div><b>${esc(name)}</b>${lastW===best&&pts.length>1?'<span class="pr">RÉCORD</span>':''}${gain>0?`<span class="pr" style="background:var(--surface2);color:var(--ink2)">+${gain} kg</span>`:''}<br><small style="color:var(--ink2)">${pts.length} sesiones</small></div><div style="text-align:right"><div style="font-family:'Barlow Condensed';font-size:24px;font-weight:700">${lastW} kg</div><small style="color:var(--ink2)">mejor ${best} kg</small>${spark(pts.map(p=>p.w))}</div></div>`; }).join('');
  shell('Progreso',esc(c.name), weekCard+(rows?`<div class="card" style="padding:4px 14px">${rows}</div>`:`<div class="empty"><div class="big-ico">📈</div>Cuando registres pesos, aquí verás cómo van subiendo.</div>`),
    {back:`go({name:'client',id:'${c.id}'})`});
};
function spark(v){ if(v.length<2) return ''; const w=100,h=26,mx=Math.max(...v),mn=Math.min(...v),rg=mx-mn||1; const pts=v.map((x,i)=>`${(i/(v.length-1))*w},${h-2-((x-mn)/rg)*(h-4)}`).join(' '); return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin-left:auto;margin-top:4px"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${w}" cy="${pts.split(' ').pop().split(',')[1]}" r="3" fill="var(--accent)"/></svg>`; }

/* ============ AJUSTES Y COPIA DE SEGURIDAD ============ */
VIEWS.settings=function(){
  const used=usedBytes(); const kb=Math.round(used/1024); const pct=Math.min(100,Math.round(used/STORAGE_MAX*100));
  const days=lastExport?Math.floor((Date.now()-lastExport)/864e5):null;
  const aviso = days===null
    ? '<div class="banner" style="border:1px solid var(--accent)"><div class="big">!</div><div class="tx"><b>Nunca has hecho una copia</b>Si pierdes el teléfono o borras los datos del navegador, se pierde todo el registro. Exporta ahora y guarda el archivo en Drive o WhatsApp.</div></div>'
    : (days>=7 ? `<div class="banner" style="border:1px solid var(--accent)"><div class="big">${days}</div><div class="tx"><b>Días desde tu última copia</b>Conviene exportar una vez por semana.</div></div>` : '');
  const nube = auth
    ? `<div class="card" style="padding:14px"><div class="sec"><div class="eyebrow">Nube</div><span class="status"><i style="background:var(--ok)"></i>Conectado</span></div>
        <p style="margin:8px 0;color:var(--ink2);font-size:14px">Sesión de <b>${esc(auth.email)}</b>. Todo se guarda en el teléfono y sube a la nube solo. Si pierdes el celular, los datos siguen ahí.</p>
        <div class="eyebrow" style="margin-bottom:8px">${esc(syncMsg||'Listo para sincronizar')}</div>
        <div class="row"><button onclick="syncNow(true)" ${syncBusy?'disabled':''}>${syncBusy?'Sincronizando…':'↻ Sincronizar ahora'}</button><button class="danger" onclick="askLogout()">Cerrar sesión</button></div></div>`
    : `<div class="card" style="padding:14px"><div class="sec"><div class="eyebrow">Nube</div><span class="status"><i></i>Sin conectar</span></div>
        <p style="margin:8px 0;color:var(--ink2);font-size:14px">Ahora los datos viven solo en este teléfono. Conéctate para que se guarden también en la nube y puedas abrirlos desde otro dispositivo.</p>
        <div class="field"><label class="lbl">Correo</label><input id="sb-mail" type="email" autocomplete="username" placeholder="correo@ejemplo.com"></div>
        <div class="field"><label class="lbl">Contraseña</label><input id="sb-pass" type="password" autocomplete="current-password"></div>
        <button class="primary" style="margin-top:10px" onclick="doLogin()">Conectar a la nube</button></div>`;
  shell('Ajustes',`Versión ${APP_VERSION}`,`
    ${nube}
    ${aviso}
    <div class="card" style="padding:14px"><div class="eyebrow">Copia de seguridad</div><p style="margin:6px 0 10px;color:var(--ink2);font-size:14px">Todos los datos viven en este teléfono. Exporta un archivo cada semana y guárdalo en Drive o WhatsApp. Con él restauras todo en otro celular o en otra dirección web.</p>
      <div class="eyebrow" style="margin-bottom:4px">Espacio usado: ${kb} KB de 5 MB (${pct}%)</div>
      <div class="progress" style="margin-bottom:10px"><i style="width:${Math.max(2,pct)}%;background:${pct>75?'#C8402A':'var(--accent)'}"></i></div><div class="row"><button onclick="exportData()">⬇ Exportar</button><button onclick="document.getElementById('imp').click()">⬆ Importar</button></div><input type="file" id="imp" accept="application/json,.json" hidden onchange="importData(this)"></div>
    <div class="card" style="padding:14px"><div class="eyebrow">Valores por defecto</div><div class="detail-row"><div>Descanso entre series</div><button class="ghost" onclick="setRest()">${Math.round(REST/60*10)/10} min ›</button></div><div class="detail-row"><div>Meta semanal para clientes nuevos</div><button class="ghost" onclick="setDefaultGoal()">${WEEK_GOAL} por semana ›</button></div></div>
    <div class="card" style="padding:14px"><div class="eyebrow">Resumen</div><div class="detail-row"><div>Clientes</div><div>${state.clients.length}</div></div><div class="detail-row"><div>Rutinas en biblioteca</div><div>${state.routines.length}</div></div><div class="detail-row"><div>Sesiones registradas</div><div>${state.logs.length}</div></div><div class="detail-row"><div>Ejercicios en el banco</div><div>${bankAll().length}</div></div><div class="detail-row"><div>Fotos guardadas</div><div>${Object.keys(state.media).length} propias + ${Object.keys(BUILTIN).length} de fábrica</div></div></div>`);
};
async function setDefaultGoal(){ const v=await ask('Meta semanal por defecto',String(WEEK_GOAL),{type:'number',ok:'Guardar'}); const n=parseInt(v); if(n>0&&n<=7){ WEEK_GOAL=n; try{ localStorage.setItem('gymlog.goal',n); }catch(e){} render(); } }
async function saveFile(filename, text, mime){
  if(dlNs===undefined){ try{ dlNs = (typeof claude!=='undefined' && claude.use) ? await claude.use('downloads') : null; }catch(e){ dlNs=null; } }
  if(dlNs){ try{ await dlNs.save({filename, data:text}); toast('Archivo guardado'); }
    catch(err){ const c=err&&err.code; if(c==='declined') toast('Guardado cancelado'); else if(c==='rate_limited') toast('Espera un momento e intenta de nuevo'); else toast('No se pudo guardar el archivo'); }
    return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); toast('Archivo descargado');
}
function exportData(){ saveFile('gym-backup-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify({v:2,app:'gymcoach',exported:Date.now(),...state}), 'application/json'); lastExport=Date.now(); try{ localStorage.setItem('gymcoach.lastExport',lastExport); }catch(e){} }
async function importData(inp){ const f=inp.files[0]; if(!f) return; try{ const d=JSON.parse(await f.text()); if(!d.routines) throw 0;
    const mode=await pick('¿Cómo importar?',[{label:'Sumar a lo que ya hay',sub:`Agrega ${d.routines.length} rutinas${d.clients?`, ${d.clients.length} clientes`:''} y ${(d.logs||[]).length} sesiones sin borrar nada`,value:'merge'},{label:'Reemplazar todo',sub:'Borra lo actual y deja solo lo del archivo',value:'replace'}]); if(!mode) return;
    if(mode==='replace'){ state={clients:d.clients||[],routines:d.routines||[],logs:d.logs||[],media:d.media||{},exmedia:d.exmedia||{},bank:d.bank||[],bankMedia:d.bankMedia||{}}; }
    else { const have=new Set(state.routines.map(r=>r.id)); (d.routines||[]).forEach(r=>{ if(!have.has(r.id)) state.routines.push(r); }); const hc=new Set(state.clients.map(c=>c.id)); (d.clients||[]).forEach(c=>{ if(!hc.has(c.id)) state.clients.push(c); }); const hl=new Set(state.logs.map(l=>l.id)); (d.logs||[]).forEach(l=>{ if(!hl.has(l.id)) state.logs.push(l); }); Object.assign(state.media,d.media||{}); Object.assign(state.exmedia,d.exmedia||{}); Object.assign(state.bankMedia,d.bankMedia||{}); (d.bank||[]).forEach(b=>{ if(!bankFind(b.name)) state.bank.push(b); }); }
    migrate(); save(); toast('Copia importada'); go({name:'clients'}); }catch(e){ toast('Archivo no válido'); } inp.value=''; }

/* ============ inicio ============ */
loadLocal(); render();
if(auth) setTimeout(()=>syncNow(), 800);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body></html>
